[project]
name = "mcp-weather"
version = "1.0.0"
description = "MCP server that fetches real-time weather — local cache + Serper web search + DeepSeek formatting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konst" }]
keywords = ["mcp", "weather", "serper", "deepseek"]
dependencies = [
    "httpx>=0.28",
    "mcp[cli]>=2.2",
    "openai>=3.11",
    "polars>=1.44",
    "python-dotenv>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_weather"]

[project.scripts]
mcp-weather = "mcp_weather.server:main"
